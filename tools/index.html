<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d0f12">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Tools">
  <title>Tools</title>
  <link rel="manifest" href="../manifest.webmanifest">
  <link rel="icon" href="../icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="../apple-touch-icon.png">
  <link rel="stylesheet" href="../styles.css">
  <style>
    .hub { width: min(100%, 760px); margin: 0 auto; padding: calc(18px + var(--safe-top)) 16px calc(28px + var(--safe-bottom)); display: grid; gap: 14px; }
    .hub-top { display: flex; align-items: end; justify-content: space-between; gap: 12px; }
    .hub-count { color: var(--muted); font-size: 12px; padding-bottom: 5px; white-space: nowrap; }
    .filters { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
    .filters::-webkit-scrollbar { display: none; }
    .chip { min-height: 34px; padding: 0 13px; border: 1px solid var(--line); border-radius: 999px; background: var(--panel); color: var(--muted); font-size: 13px; font-weight: 700; white-space: nowrap; }
    .chip.on { background: var(--panel-2); color: var(--accent); border-color: var(--accent); }
    .group-title { margin: 8px 0 0; color: var(--muted); font-size: 11px; font-weight: 800; letter-spacing: .12em; }
    .cards { display: grid; gap: 8px; }
    .card { border: 1px solid var(--line); border-radius: 14px; background: var(--panel); padding: 13px 14px; display: grid; gap: 6px; }
    .card-top { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
    .card-name { font-weight: 750; font-size: 17px; color: var(--text); text-decoration: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .badge { flex: none; font-size: 11px; font-weight: 800; letter-spacing: .04em; padding: 3px 8px; border-radius: 999px; background: var(--panel-2); color: var(--muted); }
    .badge.live { color: var(--accent); }
    .badge.building { color: #ffc46b; }
    .badge.idea { color: #9fb7ff; }
    .badge.draft { color: #c9a6ff; }
    .card-desc { color: var(--muted); font-size: 14px; line-height: 1.4; }
    .card-meta { color: var(--muted); font-size: 12px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .card-actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
    .card-actions a { min-height: 36px; padding: 0 13px; display: inline-flex; align-items: center; border-radius: 10px; border: 1px solid var(--line); background: var(--panel-2); color: var(--text); font-size: 13px; font-weight: 700; text-decoration: none; }
    .card-actions a.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
    .note { color: var(--muted); font-size: 13px; }
  </style>
</head>
<body>
  <main class="hub">
    <header class="hub-top">
      <div>
        <div class="eyebrow">MADE AND IN PROGRESS</div>
        <h1>Tools</h1>
      </div>
      <div class="hub-count" id="count"></div>
    </header>

    <nav class="pocket-switch" aria-label="Pocket tools">
      <a class="pocket-switch-link" href="../">HTML</a>
      <a class="pocket-switch-link" href="https://pocketpdf.vercel.app/">PDF</a>
      <a class="pocket-switch-link active" href="./" aria-current="page">TOOLS</a>
    </nav>

    <div class="filters" id="filters" role="toolbar" aria-label="Filter">
      <button class="chip on" data-filter="all" type="button">All</button>
      <button class="chip" data-filter="live" type="button">Live</button>
      <button class="chip" data-filter="building" type="button">Building</button>
      <button class="chip" data-filter="phone" type="button">On this phone</button>
    </div>

    <div id="groups"></div>
    <p class="note" id="note"></p>
  </main>

  <script src="../library.js"></script>
  <script>
  (function () {
    const REPO = 'https://github.com/coldysquares/pockethtml-web';
    const groupsEl = document.getElementById('groups');
    const noteEl = document.getElementById('note');
    let registry = { tools: [] };
    let drafts = [];
    let filter = 'all';
    try { filter = localStorage.getItem('pocket.tools.filter') || 'all'; } catch (e) {}

    function el(tag, cls, text) {
      const n = document.createElement(tag);
      if (cls) n.className = cls;
      if (text != null) n.textContent = text;
      return n;
    }
    function link(text, href, primary) {
      const a = el('a', primary ? 'primary' : '', text);
      a.href = href;
      if (/^https?:/.test(href) && !href.startsWith(location.origin)) { a.target = '_blank'; a.rel = 'noopener'; }
      return a;
    }
    function when(ms) {
      return new Date(ms).toLocaleDateString([], { month: 'short', day: 'numeric' });
    }
    function size(b) { return b < 1048576 ? Math.max(1, Math.round(b / 1024)) + ' KB' : (b / 1048576).toFixed(1) + ' MB'; }

    function toolCard(t) {
      const card = el('article', 'card');
      const top = el('div', 'card-top');
      const href = t.kind === 'hosted' ? t.path : t.url;
      const name = href ? link(t.name, href) : el('span', '', t.name);
      name.className = 'card-name';
      top.append(name, el('span', 'badge ' + (t.status || ''), t.status || ''));
      card.append(top);
      if (t.description) card.append(el('div', 'card-desc', t.description));
      const meta = [];
      if (t.version) meta.push('v' + t.version);
      if (t.updated) meta.push('updated ' + t.updated);
      if (t.tags && t.tags.length) meta.push(t.tags.join(', '));
      if (meta.length) card.append(el('div', 'card-meta', meta.join(' · ')));
      const actions = el('div', 'card-actions');
      if (href) actions.append(link('Open', href, true));
      if (t.kind === 'hosted') {
        actions.append(link('Edit in PocketHTML', '../?src=' + encodeURIComponent('/tools/' + t.path + 'index.html')));
        actions.append(link('History', REPO + '/commits/main/tools/' + t.path));
      } else if (t.repo) {
        actions.append(link('Repo', t.repo));
      }
      card.append(actions);
      return card;
    }

    function draftCard(d) {
      const card = el('article', 'card');
      const top = el('div', 'card-top');
      const name = link(d.title || d.name, '../?doc=' + encodeURIComponent(d.id));
      name.className = 'card-name';
      top.append(name, el('span', 'badge draft', 'draft'));
      card.append(top, el('div', 'card-meta', d.name + ' · ' + size(d.size) + ' · ' + when(d.updated)));
      const actions = el('div', 'card-actions');
      actions.append(link('Open', '../?doc=' + encodeURIComponent(d.id), true));
      card.append(actions);
      return card;
    }

    function group(title, items, make) {
      if (!items.length) return;
      groupsEl.append(el('h2', 'group-title', title));
      const list = el('div', 'cards');
      items.forEach(i => list.append(make(i)));
      groupsEl.append(list);
    }

    function render() {
      groupsEl.textContent = '';
      document.querySelectorAll('.chip').forEach(c => c.classList.toggle('on', c.dataset.filter === filter));
      const tools = registry.tools || [];
      const pick = t => filter === 'all' || t.status === filter;
      if (filter !== 'phone') {
        group('BUILT HERE', tools.filter(t => t.kind === 'hosted' && pick(t)), toolCard);
        group('OTHER APPS', tools.filter(t => t.kind !== 'hosted' && pick(t)), toolCard);
      }
      if (filter === 'all' || filter === 'phone' || filter === 'building') {
        group('IN POCKETHTML ON THIS PHONE', drafts, draftCard);
      }
      document.getElementById('count').textContent = tools.length + ' tools · ' + drafts.length + ' saved';
      if (!groupsEl.children.length) groupsEl.append(el('p', 'note', 'Nothing here yet.'));
    }

    document.getElementById('filters').addEventListener('click', e => {
      const chip = e.target.closest('.chip');
      if (!chip) return;
      filter = chip.dataset.filter;
      try { localStorage.setItem('pocket.tools.filter', filter); } catch (err) {}
      render();
    });

    Promise.all([
      fetch('registry.json', { cache: 'no-cache' }).then(r => r.json()).catch(() => { noteEl.textContent = 'Could not load the tool list. Showing what is saved on this phone.'; return { tools: [] }; }),
      (window.PocketLibrary ? window.PocketLibrary.list() : Promise.resolve([])).catch(() => [])
    ]).then(([reg, docs]) => {
      registry = reg;
      drafts = docs;
      render();
    });

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('../sw.js').catch(() => {}));
    }
  })();
  </script>
</body>
</html>
