<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d0f12">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PocketHTML">
  <title>PocketHTML</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div>
        <div class="eyebrow">LOCAL HTML WORKBENCH</div>
        <h1>PocketHTML</h1>
      </div>
      <div class="topbar-actions">
        <div class="status" id="saveStatus" aria-live="polite">Saved locally</div>
        <button id="focusButton" class="focus-button" type="button" aria-label="Hide PocketHTML controls and show the preview in focus mode">
          Full view
        </button>
      </div>
    </header>

    <nav class="pocket-switch" aria-label="Pocket tools">
      <span class="pocket-switch-link active" aria-current="page">HTML</span>
      <a class="pocket-switch-link" href="https://pocketpdf.vercel.app/">PDF</a>
    </nav>

    <nav class="mode-switch" aria-label="View mode">
      <button class="mode-button active" data-mode="code" type="button">Code</button>
      <button class="mode-button" data-mode="preview" type="button">Preview</button>
    </nav>

    <section class="toolbar" aria-label="File actions">
      <label class="button secondary file-button">
        Open
        <input id="fileInput" type="file" accept=".html,.htm,text/html,text/plain">
      </label>
      <button id="importUrlButton" class="button secondary" type="button">Import URL</button>
      <button id="newButton" class="button secondary" type="button">New</button>
      <button id="downloadButton" class="button secondary" type="button">Export</button>
      <button id="refreshButton" class="button accent" type="button">Refresh</button>
    </section>

    <section id="codePane" class="pane code-pane">
      <div class="filename-row">
        <span id="filename">untitled.html</span>
        <span class="hint">autosaves in this browser</span>
      </div>
      <textarea id="editor" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" aria-label="HTML editor"></textarea>
      <div class="symbol-bar" aria-label="Coding symbols">
        <button type="button" data-insert="<">&lt;</button>
        <button type="button" data-insert=">">&gt;</button>
        <button type="button" data-insert="/">/</button>
        <button type="button" data-insert="&quot;">&quot;</button>
        <button type="button" data-insert="'">'</button>
        <button type="button" data-insert="=">=</button>
        <button type="button" data-insert="()">()</button>
        <button type="button" data-insert="{}">{}</button>
        <button type="button" data-insert="[]">[]</button>
      </div>
    </section>

    <section id="previewPane" class="pane preview-pane" hidden>
      <iframe id="preview" title="HTML preview" scrolling="yes" sandbox="allow-scripts allow-forms allow-modals allow-popups allow-same-origin"></iframe>
    </section>

    <footer>
      <span>Everything stays on this device unless you export it.</span>
    </footer>
  </main>

  <div id="focusBar" class="focus-bar" hidden>
    <span class="focus-bar-label">PocketHTML · Preview</span>
    <button id="restoreControlsButton" class="restore-controls" type="button" aria-label="Show PocketHTML controls">
      Controls
    </button>
  </div>

  <script src="app.js"></script>
</body>
</html>
